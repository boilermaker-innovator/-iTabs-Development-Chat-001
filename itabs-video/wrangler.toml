# iTabs This Video: Cloudflare Worker config
name = "itabs-this-video"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Lets the worker import the .html files as text
rules = [{ type = "Text", globs = ["**/*.html"], fallthrough = true }]

# Where finished decks are stored (Cloudflare KV).
# Replace PASTE-KV-ID-HERE with the ID of your KV namespace
# (Cloudflare dashboard > Storage & databases > Workers KV > copy the ID).
[[kv_namespaces]]
binding = "DECKS"
id = "PASTE-KV-ID-HERE"

[vars]
# "auto" = use the newest Gemini Flash model your key can see.
# Or set an exact model name, e.g. "gemini-2.5-flash".
GEMINI_MODEL = "auto"

[observability]
enabled = true

# The Gemini key is NOT stored here. Add it in the Cloudflare dashboard:
# Worker > Settings > Variables and Secrets > Add > Type: Secret > GEMINI_API_KEY

# Later, for the custom domain:
# routes = [{ pattern = "video.itabs.co", custom_domain = true }]
